services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: pp
      POSTGRES_PASSWORD: pp
      POSTGRES_DB: pp
    ports:
      - "127.0.0.1:5432:5432"  # local tooling only; never expose the DB to the network
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pp -d pp"]
      interval: 3s
      timeout: 3s
      retries: 10

  api:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://pp:pp@db:5432/pp
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  web:
    build: ./frontend
    environment:
      BACKEND_URL: http://api:8000
      # Interpolated from .env (same value the API uses). Server-side only.
      DASHBOARD_API_KEY: ${DASHBOARD_API_KEY:?set DASHBOARD_API_KEY in .env}
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  pgdata:
