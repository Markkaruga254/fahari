name: CI

on:
  push:
    branches: [main, 'build/**']
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: pp
          POSTGRES_PASSWORD: pp
          POSTGRES_DB: pp
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U pp -d pp"
          --health-interval=3s
          --health-timeout=3s
          --health-retries=20
    defaults:
      run:
        working-directory: backend
    env:
      WEBHOOK_SECRET: test-secret
      PHONE_HASH_PEPPER: test-pepper
      DATABASE_URL: postgresql+psycopg://pp:pp@localhost:5432/pp
      AUTO_CREATE_DB: true
      AI_ENABLED: false
      STT_PROVIDER: fake
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run tests
        run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - name: Unit tests
        run: npm test
      - name: Build and typecheck
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1
      - name: Typecheck
        run: npm run typecheck
